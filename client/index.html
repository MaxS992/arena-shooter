<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARENA // Browser Shooter</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
      #app { width: 100%; height: 100%; display: block; position: relative; }
      #app canvas { display: block; width: 100%; height: 100%; }

      #menu {
        position: fixed; inset: 0; z-index: 1000;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: linear-gradient(180deg, rgba(10,10,26,0.95) 0%, rgba(20,10,30,0.98) 100%);
        cursor: pointer; user-select: none;
      }

      .menu-title {
        font-family: 'Arial Black', Impact, sans-serif;
        font-size: 64px; font-weight: 900; letter-spacing: 12px;
        color: #fff;
        text-shadow: 0 0 40px rgba(100,100,255,0.5), 0 0 80px rgba(100,100,255,0.2);
        margin-bottom: 8px;
      }
      .menu-subtitle {
        font-family: monospace; font-size: 14px; letter-spacing: 6px;
        color: rgba(255,255,255,0.4); text-transform: uppercase;
        margin-bottom: 60px;
      }

      .menu-start {
        font-family: 'Arial Black', sans-serif; font-size: 20px; letter-spacing: 4px;
        color: rgba(255,255,255,0.8); text-transform: uppercase;
        animation: pulse 2s ease-in-out infinite;
        margin-bottom: 40px;
      }
      @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

      .menu-controls {
        display: grid; grid-template-columns: auto auto; gap: 6px 20px;
        font-family: monospace; font-size: 12px; color: rgba(255,255,255,0.35);
      }
      .menu-controls .key {
        text-align: right; color: rgba(255,255,255,0.6);
        font-weight: bold;
      }

      .menu-version {
        position: absolute; bottom: 16px; right: 16px;
        font-family: monospace; font-size: 10px; color: rgba(255,255,255,0.15);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="menu">
        <div class="menu-title">ARENA</div>
        <div class="menu-subtitle">Browser Shooter</div>
        <div class="menu-start">Click to Play</div>
        <div class="menu-controls">
          <span class="key">WASD</span><span>Move</span>
          <span class="key">MOUSE</span><span>Look</span>
          <span class="key">CLICK</span><span>Shoot</span>
          <span class="key">SHIFT</span><span>Sprint</span>
          <span class="key">CTRL / C</span><span>Slide</span>
          <span class="key">SPACE</span><span>Jump</span>
          <span class="key">R</span><span>Reload</span>
          <span class="key">SCROLL</span><span>Switch Weapon</span>
        </div>
        <div class="menu-version">v0.2.0</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
